[project]
name = "opensurrogate"
version = "0.1.0"
description = "Build a neural surrogate for stiff kinetics in plain NumPy and audit its rollout error, mass drift and failures, in 3 sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
